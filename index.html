<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelime Kartları</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 3D Kart Döndürme Stilleri */
    .perspective-1000 {
      perspective: 1200px;
    }
    .transform-style-preserve-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 overflow-x-hidden">

  <!-- Üst Başlık & Kontroller -->
  <header class="w-full max-w-md mx-auto flex flex-col gap-3 pt-2">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl border border-indigo-500/30">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-white">Kelime Kartları</h1>
          <p class="text-xs text-slate-400" id="week-badge">Yükleniyor...</p>
        </div>
      </div>

      <!-- Karıştırma Butonu -->
      <button onclick="shuffleCards()" title="Kartları Karıştır" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-xl border border-slate-700/60 text-xs font-semibold transition-all">
        <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
        <span>Karıştır</span>
      </button>
    </div>

    <!-- Kategori / Hafta Seçici Menü -->
    <div class="flex items-center gap-2 bg-slate-800/90 p-1.5 rounded-2xl border border-slate-700/60">
      <span class="text-xs text-slate-400 font-semibold pl-2 flex items-center gap-1">
        <i data-lucide="filter" class="w-3.5 h-3.5"></i> Liste:
      </span>
      <select id="category-select" onchange="changeCategory(this.value)" class="flex-1 bg-slate-900 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-700/80 outline-none focus:border-indigo-500 transition-all cursor-pointer">
        <option value="board">🎯 Son Ders Kelimeleri (Tahta - 20)</option>
        <option value="all" selected>⚡ Karışık Tüm Haftalar (60 Kelime)</option>
      </select>
    </div>

    <!-- Mod Değiştirme Çubuğu -->
    <div class="bg-slate-800/80 p-1 rounded-2xl border border-slate-700/60 flex items-center justify-between text-xs font-medium">
      <button id="btn-en-tr" onclick="setMode('en-tr')" class="flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-md">
        <span>EN</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        <span>TR</span>
      </button>
      <button id="btn-tr-en" onclick="setMode('tr-en')" class="flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200">
        <span>TR</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        <span>EN</span>
      </button>
    </div>
  </header>

  <!-- Kart Alanı (Orta) -->
  <main class="w-full max-w-md mx-auto my-auto py-3">
    <!-- İlerleme Çubuğu -->
    <div class="flex items-center justify-between text-xs text-slate-400 font-medium mb-2 px-1">
      <span id="card-counter">1 / 60</span>
      <span id="flip-hint" class="text-indigo-400 flex items-center gap-1">
        <i data-lucide="touch-spread" class="w-3.5 h-3.5"></i>
        Dokun ve çevir
      </span>
    </div>
    
    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-4">
      <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 10%;"></div>
    </div>

    <!-- 3D Çevrilebilir Kart Kutusu -->
    <div class="perspective-1000 w-full h-[320px] sm:h-[340px] cursor-pointer" onclick="flipCard()">
      <div id="flashcard" class="relative w-full h-full rounded-3xl transition-transform duration-500 transform-style-preserve-3d shadow-2xl border border-slate-700/50">
        
        <!-- ÖN YÜZ -->
        <div class="absolute inset-0 w-full h-full backface-hidden rounded-3xl bg-gradient-to-br from-slate-800 to-slate-850 p-6 flex flex-col justify-between border border-slate-700/80 shadow-inner">
          <div class="flex justify-between items-center text-xs">
            <span id="front-lang-tag" class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-semibold uppercase tracking-wider">İngilizce</span>
            <span id="card-group-tag" class="text-[11px] font-medium text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded-md border border-slate-700/50">Tahta</span>
          </div>

          <div class="text-center my-auto px-2">
            <h2 id="front-word" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight break-words">Word</h2>
          </div>

          <div class="text-center text-xs text-slate-400 flex items-center justify-center gap-1.5 opacity-75">
            <i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5"></i>
            <span>Cevabı görmek için dokun</span>
          </div>
        </div>

        <!-- ARKA YÜZ -->
        <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-indigo-950/90 via-slate-850 to-slate-900 p-6 flex flex-col justify-between border border-indigo-500/40 shadow-inner">
          <div class="flex justify-between items-center text-xs">
            <span id="back-lang-tag" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-semibold uppercase tracking-wider">Türkçe Anlamı</span>
            <span class="text-indigo-300/80 flex items-center gap-1 text-[11px]">
              <i data-lucide="rotate-cw" class="w-3 h-3"></i> Ön Yüze Dön
            </span>
          </div>

          <div class="text-center my-auto px-2">
            <h2 id="back-word" class="text-2xl sm:text-3xl font-extrabold text-emerald-300 tracking-tight break-words">Anlam</h2>
          </div>

          <div class="text-center text-xs text-slate-400 opacity-75">
            <span>Tekrar çevirmek için dokun</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Alt Gezinme Butonları -->
  <footer class="w-full max-w-md mx-auto pb-4">
    <div class="grid grid-cols-2 gap-3">
      <button onclick="prevCard()" class="py-3.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold rounded-2xl border border-slate-700/80 flex items-center justify-center gap-2 transition-all shadow-lg">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
        <span>Önceki</span>
      </button>

      <button onclick="nextCard()" class="py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all">
        <span>Sonraki</span>
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>
  </footer>

  <script>
    // TÜM KELİME HAVUZU (Tahta + Defter Notları)
    const masterVocabulary = [
      // --- TAHTADAKİ KELİMELER (Grup: 'board' - 20 Adet) ---
      { en: "Demonstrate", tr: "Göstermek, kanıtlamak, sergilemek", group: "board" },
      { en: "Evaluate", tr: "Değerlendirmek", group: "board" },
      { en: "Expand", tr: "Genişlemek, genişletmek, büyütmek", group: "board" },
      { en: "Measure", tr: "Ölçmek, ölçüm yapmak; önlem", group: "board" },
      { en: "Arrest", tr: "Tutuklamak, yakalamak", group: "board" },
      { en: "Recognize", tr: "Tanımak, fark etmek, kabul etmek", group: "board" },
      { en: "Reduce", tr: "Azaltmak, düşürmek", group: "board" },
      { en: "Sustain", tr: "Sürdürmek, devam ettirmek", group: "board" },
      { en: "Support", tr: "Desteklemek, destek olmak", group: "board" },
      { en: "Deal with", tr: "İlgilenmek, ele almak, başa çıkmak", group: "board" },
      { en: "Carry on", tr: "Devam etmek, sürdürmek", group: "board" },
      { en: "Logical", tr: "Mantıklı, akla yatkın", group: "board" },
      { en: "Reliable", tr: "Güvenilir", group: "board" },
      { en: "Essential", tr: "Temel, çok önemli, hayati", group: "board" },
      { en: "Universal", tr: "Evrensel", group: "board" },
      { en: "Feature", tr: "Özellik, nitelik; yer vermek", group: "board" },
      { en: "Issue", tr: "Sorun, mesele, konu", group: "board" },
      { en: "Process", tr: "Süreç, işlem; işlemek", group: "board" },
      { en: "Structure", tr: "Yapı, bünye; yapılandırmak", group: "board" },
      { en: "Protect", tr: "Korumak, muhafaza etmek", group: "board" },

      // --- DEFTER 1. SAYFA (Grup: 'notebook' - 20 Adet) ---
      { en: "Assume", tr: "Varsaymak, farz etmek", group: "notebook" },
      { en: "Clarify", tr: "Açıklamak, netleştirmek", group: "notebook" },
      { en: "Compare", tr: "Karşılaştırmak, kıyaslamak", group: "notebook" },
      { en: "Develop", tr: "Geliştirmek, gelişmek", group: "notebook" },
      { en: "Distinctive", tr: "Eşsiz, ayırt edici, belirgin", group: "notebook" },
      { en: "Emphasize", tr: "Vurgulamak, dikkat çekmek", group: "notebook" },
      { en: "Establish", tr: "Kurmak, tesis etmek", group: "notebook" },
      { en: "Observe", tr: "Gözlemlemek, incelemek", group: "notebook" },
      { en: "Verify", tr: "Onaylamak, doğrulamak", group: "notebook" },
      { en: "Accurate", tr: "İsabetli, tam, doğru", group: "notebook" },
      { en: "Complex", tr: "Karışık, karmaşık", group: "notebook" },
      { en: "Consistent", tr: "Tutarlı, istikrarlı", group: "notebook" },
      { en: "Crucial", tr: "Hayati, çok önemli", group: "notebook" },
      { en: "Significant", tr: "Önemli, kayda değer", group: "notebook" },
      { en: "Widespread", tr: "Yaygın, geniş çapta", group: "notebook" },
      { en: "Definition", tr: "Tanım, tarif", group: "notebook" },
      { en: "Effect", tr: "Etki, tesir", group: "notebook" },
      { en: "Evidence", tr: "Kanıt, delil", group: "notebook" },
      { en: "Application", tr: "Uygulama, müracaat", group: "notebook" },
      { en: "Source", tr: "Kaynak", group: "notebook" },

      // --- DEFTER 2. SAYFA (Grup: 'notebook' - 20 Adet) ---
      { en: "Satisfaction", tr: "Memnuniyet, tatmin", group: "notebook" },
      { en: "Decide", tr: "Karar vermek", group: "notebook" },
      { en: "Arrive", tr: "Varmak, ulaşmak", group: "notebook" },
      { en: "Indicate", tr: "İşaret etmek, göstermek", group: "notebook" },
      { en: "Sincere", tr: "İçten, samimi", group: "notebook" },
      { en: "Contribute (to)", tr: "Katkı sağlamak", group: "notebook" },
      { en: "Encounter", tr: "Karşılaşma, karşılaşmak", group: "notebook" },
      { en: "Consequence", tr: "Netice, sonuç", group: "notebook" },
      { en: "Include", tr: "İçermek, kapsamak", group: "notebook" },
      { en: "Exhausted", tr: "Yorgun, tükenmiş", group: "notebook" },
      { en: "Pass away", tr: "Vefat etmek, ölmek", group: "notebook" },
      { en: "Get rid of", tr: "Kurtulmak, başından savmak", group: "notebook" },
      { en: "Handle", tr: "İdare etmek, başa çıkmak, ele almak", group: "notebook" },
      { en: "Disgusting", tr: "Tiksindirici, iğrenç", group: "notebook" },
      { en: "Obvious", tr: "Besbelli, bariz, apaçık", group: "notebook" },
      { en: "Various", tr: "Çeşitli, türlü türlü", group: "notebook" },
      { en: "Get on well", tr: "İyi geçinmek", group: "notebook" },
      { en: "Provide", tr: "Sağlamak, temin etmek", group: "notebook" },
      { en: "Cancel", tr: "İptal etmek", group: "notebook" },
      { en: "Hire", tr: "İşe almak", group: "notebook" } // İstediğin gibi güncellendi!
    ];

    let currentList = [];
    let currentIndex = 0;
    let isFlipped = false;
    let mode = 'en-tr'; // 'en-tr' | 'tr-en'
    let currentCategory = 'all';

    function setCategoryFilter(category) {
      currentCategory = category;
      if (category === 'all') {
        currentList = [...masterVocabulary];
      } else {
        currentList = masterVocabulary.filter(item => item.group === category);
      }
      currentIndex = 0;
      updateHeaderBadge();
      renderCard();
    }

    function updateHeaderBadge() {
      const badge = document.getElementById("week-badge");
      if (currentCategory === 'board') {
        badge.innerText = `🎯 Son Ders Kelimeleri (${currentList.length} Kelime)`;
      } else {
        badge.innerText = `⚡ Karışık Tüm Haftalar (${currentList.length} Kelime)`;
      }
    }

    function changeCategory(val) {
      setCategoryFilter(val);
    }

    function renderCard() {
      const card = document.getElementById("flashcard");
      isFlipped = false;
      card.classList.remove("rotate-y-180");

      if (currentList.length === 0) return;

      const item = currentList[currentIndex];
      const total = currentList.length;

      document.getElementById("card-counter").innerText = `${currentIndex + 1} / ${total}`;
      const progressPercent = ((currentIndex + 1) / total) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;

      const groupTag = document.getElementById("card-group-tag");
      groupTag.innerText = item.group === 'board' ? "🎯 Son Ders" : "📚 Eski Hafta";

      const frontWordEl = document.getElementById("front-word");
      const frontLangTagEl = document.getElementById("front-lang-tag");
      const backWordEl = document.getElementById("back-word");
      const backLangTagEl = document.getElementById("back-lang-tag");

      if (mode === 'en-tr') {
        frontLangTagEl.innerText = "İngilizce";
        frontLangTagEl.className = "px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-semibold uppercase tracking-wider text-xs";
        frontWordEl.innerText = item.en;

        backLangTagEl.innerText = "Türkçe Anlamı";
        backWordEl.innerText = item.tr;
      } else {
        frontLangTagEl.innerText = "Türkçe";
        frontLangTagEl.className = "px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-semibold uppercase tracking-wider text-xs";
        frontWordEl.innerText = item.tr;

        backLangTagEl.innerText = "İngilizce Karşılığı";
        backWordEl.innerText = item.en;
      }
    }

    function flipCard() {
      const card = document.getElementById("flashcard");
      isFlipped = !isFlipped;
      if (isFlipped) {
        card.classList.add("rotate-y-180");
      } else {
        card.classList.remove("rotate-y-180");
      }
    }

    function nextCard() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex + 1) % currentList.length;
      renderCard();
    }

    function prevCard() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      renderCard();
    }

    function setMode(selectedMode) {
      mode = selectedMode;
      const btnEnTr = document.getElementById("btn-en-tr");
      const btnTrEn = document.getElementById("btn-tr-en");

      if (mode === 'en-tr') {
        btnEnTr.className = "flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-md";
        btnTrEn.className = "flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200";
      } else {
        btnTrEn.className = "flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 bg-emerald-600 text-white shadow-md";
        btnEnTr.className = "flex-1 py-2 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200";
      }
      renderCard();
    }

    function shuffleCards() {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    // Klavye Kısayolları (Bilgisayardan çalışanlar için)
    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowRight") nextCard();
      else if (e.code === "ArrowLeft") prevCard();
      else if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
        e.preventDefault();
        flipCard();
      }
    });

    // Mobil Swipe (Kaydırma) Algılayıcı
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const distance = touchEndX - touchStartX;
      if (distance < -50) nextCard();
      else if (distance > 50) prevCard();
    }, false);

    window.onload = function() {
      lucide.createIcons();
      setCategoryFilter('all');
    };
  </script>
</body>
</html>
